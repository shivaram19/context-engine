version: "3.9"
services:
  app:
    image: your-dockerhub-username/vedaxis:latest
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file: .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: your-dockerhub-username/vedaxis:latest
    command: python infra/job_queue.py
    env_file: .env.production
    restart: unless-stopped
